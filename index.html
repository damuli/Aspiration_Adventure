<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>送氣勇者：冒險之旅</title>

<style>
body {
    font-family: "Microsoft JhengHei";
    background: linear-gradient(#1a2a6c, #b21f1f, #fdbb2d);
    color: white;
    text-align: center;
}

.game {
    max-width: 600px;
    margin: 30px auto;
    background: rgba(0,0,0,0.65);
    padding: 25px;
    border-radius: 15px;
}

h1 {
    margin-bottom: 10px;
}

.progress {
    font-size: 18px;
    margin: 5px;
}

.story {
    font-size: 18px;
    margin: 15px 0;
    min-height: 50px;
}

button {
    padding: 12px 20px;
    margin: 10px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
}

.play {
    background: #00e5ff;
}

.choice {
    background: gold;
    color: black;
}

.result {
    font-size: 18px;
    margin-top: 10px;
    min-height: 24px;
}
</style>
</head>

<body>

<div class="game">

<h1>⚔️ 送氣勇者：冒險之旅</h1>

<p class="progress">第 <span id="qNum">1</span> / 10 關</p>
<p class="progress">🎯 分數：<span id="score">0</span></p>

<div class="story" id="story">
你踏入語音森林，前方傳來神秘聲音…
</div>

<hr>

<button class="play" onclick="playSound()">🔊 聽聲音</button>

<br>

<div id="choices"></div>

<p class="result" id="result"></p>

</div>

<script>

// 題庫（最小對立）
let questions = [
["爸","怕"],
["波","坡"],
["東","通"],
["高","靠"],
["白","排"]
];

let voices = [];
speechSynthesis.onvoiceschanged = () => {
    voices = speechSynthesis.getVoices();
};

let current;
let answerKey;

let qIndex = 0;
let score = 0;

// 新題目
function newQuestion(){
    let pair = questions[Math.floor(Math.random()*questions.length)];

    answerKey = pair[Math.floor(Math.random()*2)];
    current = answerKey;

    let shuffled = [...pair].sort(()=>Math.random()-0.5);

    let html = "";
    shuffled.forEach(c=>{
        html += `<button class="choice" onclick="answer('${c}')">${c}</button>`;
    });

    document.getElementById("choices").innerHTML = html;
}

// 播音
function playSound(){
    let u = new SpeechSynthesisUtterance(current);

    let v = voices.find(v=>v.lang==="zh-TW") || voices.find(v=>v.lang==="zh-CN");
    if(v) u.voice = v;

    u.rate = 0.85 + Math.random()*0.3;
    u.pitch = 0.9 + Math.random()*0.2;

    speechSynthesis.speak(u);
}

// 作答
function answer(choice){

    if(choice === answerKey){
        score += 10;
        document.getElementById("result").innerText = "⚔️ 命中！";
    }else{
        document.getElementById("result").innerText = "💥 錯了！正確是：" + answerKey;
    }

    qIndex++;

    if(qIndex < 10){
        updateUI();
        newQuestion();
    }else{
        endGame();
    }
}

// 更新UI
function updateUI(){

    document.getElementById("qNum").innerText = qIndex + 1;
    document.getElementById("score").innerText = score;

    let stories = [
        "🌲 你深入森林，聲音變得模糊…",
        "👾 敵人出現！集中聽力！",
        "🌫 迷霧籠罩，你的判斷受到考驗…",
        "🔥 接近最終挑戰，不能失誤！"
    ];

    document.getElementById("story").innerText =
        stories[Math.floor(Math.random()*stories.length)];
}

// 結算畫面
function endGame(){

    let title = "";
    let comment = "";

    if(score >= 90){
        title = "👑 聽覺大師";
        comment = "你已完全掌握送氣音的差異！";
    }
    else if(score >= 80){
        title = "⚔️ 語音勇者";
        comment = "表現非常好，只差一點就完美！";
    }
    else if(score >= 60){
        title = "🧭 冒險學徒";
        comment = "你正在進步，再練習就會更強！";
    }
    else{
        title = "🌱 初學者";
        comment = "別擔心，多聽幾次就會進步！";
    }

    document.getElementById("story").innerHTML =
    `
    🎉 冒險結束！<br><br>
    🏆 稱號：${title}<br>
    🎯 得分：${score} / 100<br><br>
    💬 評語：${comment}<br><br>
    <button onclick="location.reload()">🔄 再挑戰一次</button>
    `;

    document.getElementById("choices").innerHTML = "";
    document.getElementById("result").innerText = "";
}

// 初始化
newQuestion();

</script>

</body>
</html>
